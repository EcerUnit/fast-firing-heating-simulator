[pycodestyle]
max-line-length = 100
# E122: the embedded documentation in heating_simulator.py is a list of
#       flush-left triple-quoted blocks, which is what makes it readable
#       as prose in the source.
# E402: docs/make_figures.py must pick the Agg backend before importing
#       pyplot.
# E702: the plotting lines in docs/make_figures.py pair an axis call with
#       its label on one line on purpose; one statement per line would
#       double the length of the script without making it clearer.
# E241: the material presets and the variable table are aligned into
#       columns on purpose; they are read as tables, not as code.
ignore = E122, E241, E402, E702, W503, W504
exclude = .git,__pycache__
